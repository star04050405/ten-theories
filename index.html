<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>创富圈十大理论 · NEXUS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="十大理论">
<meta name="theme-color" content="#05060A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#05060A; --card:rgba(13,17,28,.72); --fg:#EAF2FF; --dim:#5E6B85;
  --cy:#00F0FF; --pu:#8B5CF6; --pk:#FF2E88; --or:#FF9E2C; --gr:#00FF9D; --bl:#4D7CFE;
  --line:rgba(120,160,255,.14);
  --sans:"Helvetica Neue","Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;
  --disp:"Arial Black","Helvetica Neue","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);max-width:680px;margin:0 auto;padding:0 18px 120px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* 网格+光晕背景 */
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0}
.bgfx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 75%)}
.bgfx .glow1{position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:560px;height:360px;background:radial-gradient(ellipse,rgba(0,240,255,.16),transparent 65%);filter:blur(30px)}
.bgfx .glow2{position:absolute;top:180px;right:-120px;width:340px;height:340px;background:radial-gradient(circle,rgba(139,92,246,.14),transparent 65%);filter:blur(40px)}
.bgfx .glow3{position:absolute;bottom:-80px;left:-100px;width:380px;height:380px;background:radial-gradient(circle,rgba(255,46,136,.10),transparent 65%);filter:blur(44px)}
.scan{position:fixed;left:0;right:0;height:120px;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(0,240,255,.035),transparent);animation:scan 7s linear infinite}
@keyframes scan{0%{top:-120px}100%{top:100%}}
header,.tcard,.core,footer{position:relative;z-index:1}
header{padding:64px 2px 10px;text-align:center}
.sys{font-family:var(--mono);font-size:10px;letter-spacing:.42em;color:var(--cy);text-shadow:0 0 12px rgba(0,240,255,.6)}
.sys i{font-style:normal;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-family:var(--disp);font-size:clamp(38px,11.5vw,68px);line-height:1.05;margin-top:16px;letter-spacing:.02em;
 background:linear-gradient(92deg,var(--cy) 8%,var(--pu) 42%,var(--pk) 72%,var(--or) 96%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px rgba(0,240,255,.35)) drop-shadow(0 0 60px rgba(139,92,246,.22))}
.sub{margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);line-height:2}
.sub b{color:var(--cy);font-weight:400}
/* 数据舱 */
.core{margin-top:26px;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(14px);padding:18px 16px}
.crow{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
.crow .lv{color:var(--gr);text-shadow:0 0 10px rgba(0,255,157,.5)}
.cbar{height:6px;border-radius:3px;background:rgba(120,160,255,.12);margin:12px 0 10px;overflow:hidden;position:relative}
.cbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--pu),var(--pk));box-shadow:0 0 14px rgba(0,240,255,.7);transition:width .6s cubic-bezier(.3,1,.4,1)}
.cbar i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:#fff;filter:blur(3px);border-radius:4px}
.cfoot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}
.cfoot b{color:var(--fg);font-weight:400}
/* 理论卡 */
.tcard{margin-top:14px;border-radius:16px;position:relative;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));padding:1px;opacity:0;transform:translateY(14px);animation:in .55s forwards}
@keyframes in{to{opacity:1;transform:none}}
.tcard::before{content:"";position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(135deg,var(--c1),transparent 40%,transparent 60%,var(--c2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tcard-in{background:var(--card);backdrop-filter:blur(14px);border-radius:15px;overflow:hidden}
.tcard-h{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.tcard-h .no{font-family:var(--disp);font-size:26px;flex:none;color:var(--c1);text-shadow:0 0 18px var(--c1)}
.tcard-h .nm{font-family:var(--disp);font-size:17.5px;flex:1;letter-spacing:.04em}
.tcard.open .tcard-h .nm{text-shadow:0 0 16px var(--c1)}
.tcard-h .en{font-family:var(--mono);font-size:8px;letter-spacing:.24em;color:var(--dim);text-align:right;line-height:1.7}
.tcard-h .arr{font-family:var(--mono);font-size:11px;color:var(--c1);transition:transform .3s}
.tcard.open .tcard-h .arr{transform:rotate(90deg)}
.tcard-b{display:none;padding:2px 18px 18px}
.tcard.open .tcard-b{display:block}
.declare{font-size:14px;line-height:2;color:#C8D6EE;border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:rgba(0,240,255,.03);position:relative}
.declare::before{content:"▍";color:var(--c1);margin-right:2px}
.pts{list-style:none;margin-top:12px}
.pts li{font-size:12px;line-height:2.1;color:var(--dim);padding-left:20px;position:relative}
.pts li::before{content:"▸";position:absolute;left:0;color:var(--c1)}
.tcard.open .tcard-in{box-shadow:0 0 40px rgba(0,240,255,.07), inset 0 0 30px rgba(139,92,246,.04)}
/* 充能舱 */
.dock{margin-top:34px;border-radius:20px;padding:1px;background:linear-gradient(135deg,var(--cy),var(--pu) 50%,var(--pk))}
.dock-in{background:rgba(8,11,18,.92);backdrop-filter:blur(16px);border-radius:19px;padding:22px 18px}
.dock .k{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--cy);text-align:center;text-shadow:0 0 12px rgba(0,240,255,.6)}
.dock h2{font-family:var(--disp);font-size:18px;text-align:center;margin-top:8px;letter-spacing:.05em}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.slot{border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02);transition:all .25s;position:relative;overflow:hidden}
.slot .sig{font-family:var(--disp);font-size:15px;display:block}
.slot .nm2{font-size:9.5px;color:var(--dim);margin-top:5px;letter-spacing:.08em}
.slot.on{border-color:var(--sc);background:rgba(255,255,255,.04);box-shadow:0 0 18px rgba(255,255,255,.05), inset 0 0 14px rgba(255,255,255,.03)}
.slot.on .sig{color:var(--sc);text-shadow:0 0 14px var(--sc)}
.slot.on .nm2{color:var(--fg)}
.slot .pulse{position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,var(--sc),transparent 60%);opacity:0;transition:opacity .3s}
.slot.on .pulse{opacity:.14}
.vpanel{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;text-align:center}
.vpanel .k{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}
.vpanel .v2{font-family:var(--disp);font-size:24px;margin-top:10px;letter-spacing:.03em;
 background:linear-gradient(92deg,var(--cy),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 16px rgba(255,46,136,.35))}
.vpanel p{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:9px;letter-spacing:.12em;line-height:1.9}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--dim);line-height:2.1;letter-spacing:.1em;text-align:center}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:rgba(0,240,255,.12);border:1px solid rgba(0,240,255,.4);color:var(--cy);font-family:var(--mono);font-size:12px;letter-spacing:.14em;padding:10px 20px;border-radius:99px;z-index:970;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(8px)}
.cfp{position:fixed;width:6px;height:6px;border-radius:50%;z-index:960;pointer-events:none}
</style>
</head>
<body>
<div class="bgfx"><div class="grid"></div><div class="glow1"></div><div class="glow2"></div><div class="glow3"></div></div>
<div class="scan"></div>
<header>
  <div class="sys">SYSTEM ONLINE <i>▊</i> NEXUS-10</div>
  <h1>创富圈十大理论</h1>
  <div class="sub">FORTUNE PROTOCOLS // 民间高手智慧内核<br>已解码 <b>10</b> 条 · 选择你的强化路线</div>
</header>
<div class="core">
  <div class="crow"><span>PROTOCOL LOAD</span><span class="lv" id="coreLv">STANDBY</span></div>
  <div class="cbar"><i id="cBar"></i></div>
  <div class="cfoot"><span>已激活 <b id="cN">0</b> / 10</span><span>日期 <b id="cDate"></b></span></div>
</div>
<div id="list"></div>
<div class="dock">
  <div class="dock-in">
    <div class="k">/// DAILY CHARGE · 今日充能</div>
    <h2>点亮你今天执行的理论</h2>
    <div class="slots" id="slots"></div>
    <div class="vpanel">
      <div class="k">/// TODAY RANK</div>
      <div class="v2" id="verdict"></div>
      <p id="vdesc"></p>
    </div>
  </div>
</div>
<footer>/// NEXUS-10 · 民间创富圈智慧汇编 · 仅供娱乐与自我打气<br>/// 充能记录按日重置 · 健康问题请遵专业建议</footer>
<div id="toast"></div>
<script>
const C = ["#00F0FF","#8B5CF6","#FF2E88","#FF9E2C","#00FF9D","#4D7CFE","#00F0FF","#8B5CF6","#FF2E88","#00FF9D"];
const T = [
 {no:"01", nm:"薄肌理论", en:"LEAN MUSCLE", declare:"健康的低脂肪身材，加上矫健帅气的肌肉——要的是脱衣有肉，穿衣显瘦。",
  pts:["力量训练与有氧并存","体脂率比体重秤数字重要"]},
 {no:"02", nm:"大睡理论", en:"GREAT SLEEP", declare:"每天雷打不动睡满 8 个小时，并确保优质的深度睡眠——绝不熬夜。",
  pts:["固定入睡时间就是最贵的自律","睡前一小时远离屏幕"]},
 {no:"03", nm:"大水理论", en:"HYDRATION", declare:"平均每天喝 1.5–2L 的纯净水，不喝奶茶饮料以及不健康的饮品。",
  pts:["水杯随身带，渴之前先喝","奶茶是甜品，不是水"]},
 {no:"04", nm:"黄毛理论", en:"BE YOURSELF", declare:"不被传统规矩束缚，自利且自我优先，敢爱敢恨，不在乎他人眼光。",
  pts:["先照顾好自己，再谈别的","他人的眼光不构成你的义务"]},
 {no:"05", nm:"大蛋理论", en:"EGG DAILY", declare:"保持每天吃三个白煮鸡蛋的习惯，确保自己有足够的实惠蛋白质。",
  pts:["便宜、优质、顶饱三合一","水煮蛋是蛋白质的性价比之王"]},
 {no:"06", nm:"大菜理论", en:"MORE VEGGIES", declare:"确保自己摄入 300–500g 蔬菜，而不是每天只吃各种精加工的食品。",
  pts:["每餐先夹一筷子绿","深色蔬菜占一半"]},
 {no:"07", nm:"大锅理论", en:"HOME COOKING", declare:"吃自己做的菜，并只用水煮或简单清炒的方式烹饪，不吃太多油腻。",
  pts:["厨房是最省钱的健身房","少油少盐，原味优先"]},
 {no:"08", nm:"氧气理论", en:"OXYGEN RUN", declare:"每周跑步，理想化 30 公里，少一点则 20 公里，保持健康肺活。",
  pts:["配速不重要，跑起来才重要","里程是攒出来的"]},
 {no:"09", nm:"孙学理论", en:"SELF-INTEREST", declare:"凡事利益至上，不在乎他人观感和舆论，以自己能得到实际好处为最高优先级。",
  pts:["先算自己的账，再看别人的嘴","拒绝也是生产力"]},
 {no:"10", nm:"纯日子理论", en:"SIMPLE LIFE", declare:"对自己没有要求，只在乎凑合活着，把日子简单过，随自己心意。",
  pts:["躺平是权利，不是失败","简单的日子最养人"]}
];
const SIG = ["肌","眠","水","我","蛋","菜","锅","氧","利","日"];
const KEY="tentheories";
const today = new Date().toISOString().slice(0,10);
let done = {};
try{ const raw = JSON.parse(localStorage.getItem(KEY)||"{}"); if(raw.date===today) done = raw.done||{}; }catch(e){}
function save(){ localStorage.setItem(KEY, JSON.stringify({date:today, done})); }
document.getElementById("cDate").textContent = today.slice(5).replace("-","·");
document.getElementById("list").innerHTML = T.map((t,i)=>`
 <div class="tcard" id="tc${i}" style="--c1:${C[i]};--c2:${C[(i+3)%10]};animation-delay:${i*70}ms">
  <div class="tcard-in">
   <div class="tcard-h" onclick="tog(${i})">
     <span class="no">${t.no}</span>
     <span class="nm">${t.nm}</span>
     <span class="en">${t.en}<br>PROTOCOL</span>
     <span class="arr">›</span>
   </div>
   <div class="tcard-b">
     <div class="declare">${t.declare}</div>
     <ul class="pts">${t.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
   </div>
  </div>
 </div>`).join("");
function tog(i){ document.getElementById("tc"+i).classList.toggle("open"); }
function renderCore(){
  const n = Object.values(done).filter(Boolean).length;
  document.getElementById("cN").textContent = n;
  document.getElementById("cBar").style.width = (n*10)+"%";
  document.getElementById("coreLv").textContent = n>=10?"OVERFLOW":n>=7?"MAX POWER":n>=4?"CHARGING":n>=1?"WARM UP":"STANDBY";
  const V = n>=10 ? ["十大全才 · 创富圣体","十槽全亮——你就是行走的创富圈教材。"]
        : n>=7 ? ["理论践行家","七条以上，圈子都得喊你一声老师。"]
        : n>=4 ? ["入门创富人","过半了，风向已经开始偏向你。"]
        : n>=1 ? ["纯日子大师（预备）","有一条算一条，纯日子也是讲究方法的。"]
        : ["观望型选手","一格都没亮——从大水理论开始充能？"];
  document.getElementById("verdict").textContent = "「"+V[0]+"」";
  document.getElementById("vdesc").textContent = V[1]+" · CHARGE "+n+"/10";
}
function renderSlots(){
  document.getElementById("slots").innerHTML = T.map((t,i)=>`
   <div class="slot ${done[i]?"on":""}" style="--sc:${C[i]}" onclick="tg(${i})">
     <div class="pulse"></div>
     <span class="sig">${SIG[i]}</span>
     <span class="nm2">${t.nm.slice(0,2)}</span>
   </div>`).join("");
}
function tg(i){
  done[i] = !done[i]; save(); renderSlots(); renderCore();
  if(done[i]){ confetti(C[i]); toast("✓ "+T[i].nm+" · 已充能"); }
}
function confetti(col){
  for(let i=0;i<18;i++){
    const c=document.createElement("div"); c.className="cfp";
    c.style.background=i%3?col:"#EAF2FF";
    c.style.left=(34+Math.random()*32)+"vw"; c.style.top=(30+Math.random()*16)+"vh";
    c.style.width=c.style.height=(4+Math.random()*6)+"px";
    c.style.boxShadow="0 0 8px "+col;
    document.body.appendChild(c);
    const dx=(Math.random()-.5)*280, dy=100+Math.random()*240, rot=Math.random()*720-360;
    c.animate([{transform:"none",opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],
      {duration:900+Math.random()*600, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>c.remove();
  }
}
let toastTimer;
function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m; t.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity=0,1400);
}
renderSlots(); renderCore();
</script>
</body>
</html>
